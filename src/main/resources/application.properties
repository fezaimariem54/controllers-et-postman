spring.application.name=autoloc-api

# Port de l'application (8080 est pris par le Tomcat de XAMPP)
server.port=8082

# Connexion à la base de données (mot de passe via variable d'environnement DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Sérialisation JSON des associations LAZY pendant la requête HTTP
spring.jpa.open-in-view=true

# Swagger UI (SpringDoc) : http://localhost:8081/swagger-ui.html
server.servlet.context-path=/autoloc
